<nav class="bg-gradient-to-r from-brand-700 to-brand-900 shadow-lg">
    <div class="container mx-auto px-4">
        <!-- Desktop Navigation -->
        <div class="hidden md:flex justify-between items-center h-16">
            <div class="flex items-center">
                <a routerLink="" class="flex items-center space-x-2">
                    <span class="text-white font-bold text-xl">Tickkk</span>
                </a>
            </div>

            <div class="flex items-center space-x-6">
                @if (isLoggedIn()) {
                <a routerLink="/dashboard" class="text-white hover:text-brand-200 transition-colors duration-200">
                    <i class="fas fa-chart-line mr-1"></i> Dashboard
                </a>

                <a routerLink="/tasks" class="text-white hover:text-brand-200 transition-colors duration-200">
                    <i class="fas fa-list-check mr-1"></i> My Tasks
                </a>

                <a routerLink="/tasks/new" class="text-white hover:text-brand-200 transition-colors duration-200">
                    <i class="fas fa-plus mr-1"></i> New Task
                </a>

                <a routerLink="/profile" class="text-white hover:text-brand-200 transition-colors duration-200 font-medium ml-4 flex items-center">
                    <i class="fas fa-user-circle mr-1 text-base"></i> {{ getUserName() }}
                </a>

                <button (click)="themeService.toggleTheme($event)" class="text-white hover:text-brand-200 transition-colors duration-200 focus:outline-none">
                    <i class="fas" [ngClass]="themeService.isDarkMode() ? 'fa-sun' : 'fa-moon'"></i>
                </button>

                <button (click)="logout()"
                    class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-md transition-colors duration-200">
                    <i class="fas fa-sign-out-alt mr-1"></i> Logout
                </button>
                } @else {
                <a routerLink="/login" class="text-white hover:text-brand-200 transition-colors duration-200">
                    <i class="fas fa-sign-in-alt mr-1"></i> Login
                </a>
                
                <button (click)="themeService.toggleTheme($event)" class="text-white hover:text-brand-200 transition-colors duration-200 focus:outline-none ml-4">
                    <i class="fas" [ngClass]="themeService.isDarkMode() ? 'fa-sun' : 'fa-moon'"></i>
                </button>
                }
            </div>
        </div>

        <!-- Mobile Navigation -->
        <div class="md:hidden">
            <div class="flex justify-between items-center h-14">
                <a routerLink="" class="flex items-center space-x-2">
                    <span class="text-white font-bold text-lg">Tickkk</span>
                </a>

                <button (click)="toggleMobileMenu()" class="text-white focus:outline-none">
                    <i class="fas" [ngClass]="showMobileMenu() ? 'fa-times' : 'fa-bars'"></i>
                </button>
            </div>

            <!-- Mobile Menu -->
            <div [ngClass]="showMobileMenu() ? 'block' : 'hidden'" class="pt-2 pb-3 space-y-1">
                @if (isLoggedIn()) {
                <a routerLink="/profile" class="block px-3 py-2 text-brand-200 hover:bg-brand-700 transition-colors duration-200 font-medium">
                    <i class="fas fa-user-circle mr-1"></i> {{ getUserName() }}
                </a>

                <a routerLink="/tasks"
                    class="block px-3 py-2 text-white hover:bg-brand-700 transition-colors duration-200">
                    <i class="fas fa-list-check mr-1"></i> My Tasks
                </a>

                <a routerLink="/tasks/new"
                    class="block px-3 py-2 text-white hover:bg-brand-700 transition-colors duration-200">
                    <i class="fas fa-plus mr-1"></i> New Task
                </a>

                <button (click)="themeService.toggleTheme($event)"
                    class="w-full text-left px-3 py-2 text-white hover:bg-brand-700 transition-colors duration-200">
                    <i class="fas w-5" [ngClass]="themeService.isDarkMode() ? 'fa-sun' : 'fa-moon'"></i> Toggle Theme
                </button>

                <button (click)="logout()"
                    class="w-full text-left px-3 py-2 text-white hover:bg-red-600 transition-colors duration-200">
                    <i class="fas fa-sign-out-alt mr-1"></i> Logout
                </button>
                } @else {
                <a routerLink="/login"
                    class="block px-3 py-2 text-white hover:bg-brand-700 transition-colors duration-200">
                    <i class="fas fa-sign-in-alt mr-1"></i> Login
                </a>
                
                <button (click)="themeService.toggleTheme($event)"
                    class="w-full text-left px-3 py-2 text-white hover:bg-brand-700 transition-colors duration-200">
                    <i class="fas w-5" [ngClass]="themeService.isDarkMode() ? 'fa-sun' : 'fa-moon'"></i> Toggle Theme
                </button>
                }
            </div>
        </div>
    </div>
</nav>
