services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tickkk_frontend
    ports:
      - "9091:80"
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tickkk_backend
    expose:
      - "3000"
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: tickkk_mongo
    restart: unless-stopped
    command: ["--auth"]
    ports:
      - "27028:27017"
    volumes:
      - tickkk_mongo_data:/data/db

volumes:
  tickkk_mongo_data:
